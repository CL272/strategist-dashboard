name: Update data & publish dashboard

on:
  schedule:
    # every 30 minutes: headlines every run; full data refresh once a daily slot
    # (06:30 and 18:15 Singapore) has passed - see pipeline/update.py
    - cron: "7,37 * * * *"
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # to commit the credit-spread and AI archives
  issues: write     # to open / close the "Data health alert" issue

  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Start from the currently published data, so a source that fails today keeps yesterday's values
      - name: Fetch previously published data
        run: |
          mkdir -p docs/data
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for f in yahoo.json fred.json derived.json curves.json asia.json meta.json news.json calendar.json fedpath.json; do curl -sfL "$base/$f" -o "docs/data/$f" || rm -f "docs/data/$f"; done

      - name: Pull latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_API_KEY || secrets.ESTAT_APP_ID }}
          FULL: ${{ github.event_name != 'schedule' }}
        run: python pipeline/update.py

      - name: Save credit-spread archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          [ -d archive ] || exit 0
          git add archive
          if ! git diff --cached --quiet; then
            git commit -m "Archive ICE BofA spread history"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Data health alert (opens an issue when series go stale; GitHub emails you)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f docs/data/health.json ] || exit 0
          n=$(python -c "import json;print(json.load(open('docs/data/health.json'))['n_bad'])")
          gh label create data-health --color B60205 --description "Stale or missing data" --force >/dev/null 2>&1 || true
          open=$(gh issue list --label data-health --state open --json number --jq '.[0].number' || true)
          if [ "$n" -gt 0 ]; then
            python - <<'PY' > body.md
          import json
          h = json.load(open("docs/data/health.json"))
          print(f"Checked {h['checked_utc']}: {h['n_bad']} series stale or missing.\n")
          print("| Series | Source | Last data | Frequency | State |\n|---|---|---|---|---|")
          for r in h["rows"]:
              if r["state"] in ("stale", "missing"):
                  print(f"| {r['label']} (`{r['id']}`) | {r['source']} | {r['last']} | {r['freq']} | {r['state']} |")
          print("\nThis issue closes itself when the data updates again. Details: the Data health page on the dashboard.")
          PY
            if [ -n "$open" ]; then gh issue edit "$open" --body-file body.md; else gh issue create --title "Data health alert" --label data-health --body-file body.md; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All series are updating again."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
