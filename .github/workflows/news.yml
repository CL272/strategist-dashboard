name: Live headlines

# Headlines on their own fast lane. One run loops for almost 6 hours, rebuilding the headlines every
# 10 minutes and force-pushing them to the "live-news" branch (a single file, no history). The dashboard
# reads that file directly, so new headlines show up without a full rebuild of the site.
# GitHub's scheduler often skips runs for hours, so each run starts the next one itself when it ends
# (a workflow_dispatch, which GITHUB_TOKEN is allowed to trigger); the schedule is only a backup.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pipeline/news.py, .github/workflows/news.yml]

permissions:
  contents: write
  actions: write   # to start the next run when this one ends

concurrency:
  group: live-news
  cancel-in-progress: false

jobs:
  headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh headlines every 10 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          end=$((SECONDS + 340 * 60))
          while [ $SECONDS -lt $end ]; do
            python pipeline/news.py > /dev/null || echo "headline build failed; trying again next round"
            if [ -s docs/data/news.json ]; then
              tmp=$(mktemp -d)
              cp docs/data/news.json "$tmp/news.json"
              (
                cd "$tmp"
                git init -q -b live-news
                git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" add news.json
                git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" commit -qm "Headlines $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" live-news
              ) && echo "pushed headlines at $(date -u +%H:%M) UTC" || echo "push failed"
              rm -rf "$tmp"
            fi
            sleep 600
          done

      - name: Start the next run
        if: (success() || failure()) && github.ref == 'refs/heads/main'   # not after a manual cancel, so the chain can be stopped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run news.yml --repo "${{ github.repository }}" --ref main || echo "could not start the next run; the schedule will"
